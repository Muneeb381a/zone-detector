services:
  - type: web
    name: zoning-map-date-auditor
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @zoning/web
    startCommand: npm start -w @zoning/server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_WEB
        value: "1"
      # Free plan: disk is wiped on every deploy/restart. For persistent data use plan: starter,
      # add a disk mounted at /var/data and set DB_PATH=/var/data/auditor.db
      # Google sign-in (optional): GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
      # GOOGLE_REDIRECT_URI=https://<your-service>.onrender.com/api/auth/google/callback
